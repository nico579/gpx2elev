name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check common version and release tag
        run: python tools/check_versions.py

  android:
    needs: versions
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Android SDK
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" 'platforms;android-34' 'build-tools;34.0.0'
      - name: Restore project signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/debug.keystore
          chmod 600 app/debug.keystore
      - name: Tests, lint and signed release APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintRelease assembleRelease --console=plain --no-daemon --max-workers=2
      - name: Verify identifier, signature, version and test results
        run: python tools/package_android.py
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release/*
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing key
        if: always()
        run: rm -f app/debug.keystore

  desktop:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            artifact: windows-x64
            binary: dist/gpx2elev/gpx2elev.exe
          - runner: ubuntu-22.04
            artifact: linux-x64
            binary: dist/gpx2elev/gpx2elev
          - runner: macos-15-intel
            artifact: macos-x64
            binary: dist/gpx2elev.app/Contents/MacOS/gpx2elev
          - runner: macos-14
            artifact: macos-arm64
            binary: dist/gpx2elev.app/Contents/MacOS/gpx2elev
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'desktop/requirements*.txt'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test core, models and GUI
        run: python -m unittest discover -s tests -v
      - name: Build and verify native executable
        run: python tools/build_bundle.py
      - name: Test web interface in a real browser, sources and bundle
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          python tools/check_web_ui.py --output qa/source
          python tools/check_web_ui.py --executable "${{ matrix.binary }}" --output qa/packaged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-${{ matrix.artifact }}
          path: desktop/qa/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [android, desktop]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: "{android,windows-x64,linux-x64,macos-x64,macos-arm64}"
          merge-multiple: true
      - name: Publish verified APK and bundles
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat release-assets/SHA256SUMS-*.txt | tr -d '\r' > release-assets/SHA256SUMS.txt
          cd release-assets
          test "$(wc -l < SHA256SUMS.txt)" -eq 5
          sha256sum -c SHA256SUMS.txt
          cd ..
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "gpx2elev $RELEASE_TAG — Android, Windows, Linux et macOS" --notes-file desktop/RELEASE_NOTES.md --draft
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
