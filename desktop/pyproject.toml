[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gpx2elev"
description = "Dénivelé GPX, MNT et protocole spatial 5 m / 20 m / 2 m"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dynamic = ["version"]
# Le paquet seul est le moteur (core, providers), utilisable sans interface,
# par exemple par gpx2dash. Les versions figées des bundles restent dans
# requirements.txt.
dependencies = [
    "numpy>=1.26",
    "Pillow>=11.3",
    "requests>=2.34",
    "rasterio>=1.4",
    "defusedxml>=0.7.1",
    # Commun jusqu'à la 1.0 (décision du 2026-09-29) : une version mineure du
    # commun n'oblige plus hike2gpx à attendre une release de gpx2elev.
    "nico579-commons>=0.5.1,<1",
]

[project.optional-dependencies]
# Le serveur web et son systray : pip install "gpx2elev[gui]".
gui = ["nico579-commons[tray]>=0.5.1,<1"]

[project.urls]
Source = "https://github.com/nico579/gpx2elev"

[project.gui-scripts]
gpx2elev = "gpx2elev.__main__:main"

[tool.setuptools]
# assets/ déclaré comme paquet : setuptools n'inclura bientôt plus un dossier de
# données absent de cette liste, et __init__.py lit assets/version.txt.
packages = ["gpx2elev", "gpx2elev.assets", "gpx2elev.assets.web"]

[tool.setuptools.dynamic]
version = {attr = "gpx2elev.__version__"}

[tool.setuptools.package-data]
"gpx2elev.assets" = ["*"]
"gpx2elev.assets.web" = ["*"]
